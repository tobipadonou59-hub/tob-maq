<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Mr+Dafoe&display=swap">
<style>
html,body{margin:0;width:842px;height:595px;overflow:hidden;background:transparent}
svg{display:block}
</style></head><body>
<!-- Fond du certificat TOB-MAQ (A4 paysage, 842 × 595 pt). Les textes variables sont ajoutés par le serveur. -->
<svg id="fond" width="842" height="595" viewBox="0 0 842 595" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9C6B1E"/><stop offset=".25" stop-color="#E9C46A"/><stop offset=".5" stop-color="#B8862B"/><stop offset=".75" stop-color="#F3D98B"/><stop offset="1" stop-color="#A6741F"/></linearGradient>
  <linearGradient id="orV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C6B1E"/><stop offset=".35" stop-color="#F3D98B"/><stop offset=".6" stop-color="#C9962F"/><stop offset="1" stop-color="#8E5F18"/></linearGradient>
  <linearGradient id="ruban" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1E5C"/><stop offset=".55" stop-color="#151A2E"/><stop offset="1" stop-color="#0B0E17"/></linearGradient>
  <radialGradient id="papier" cx=".6" cy=".4" r=".9"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F3EE"/></radialGradient>
  <pattern id="trame" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="14" stroke="#E9E4DA" stroke-width=".6"/></pattern>
  <clipPath id="ic"><rect x="-26" y="-26" width="52" height="52" rx="12"/></clipPath>
  <filter id="ombre" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="842" height="595" fill="url(#papier)"/>
<rect x="30" y="30" width="782" height="535" fill="url(#trame)" opacity=".55"/>
<!-- Guillochis discret -->
<g fill="none" stroke="#EDE6D8" stroke-width=".7" opacity=".9">

</g>
<!-- Cadres dorés -->
<rect x="16" y="16" width="810" height="563" fill="none" stroke="url(#or)" stroke-width="4"/>
<rect x="26" y="26" width="790" height="543" fill="none" stroke="url(#or)" stroke-width="1.2"/>
<!-- Ruban vertical -->
<g filter="url(#ombre)">
  <rect x="70" y="0" width="86" height="595" fill="url(#ruban)"/>
  <rect x="70" y="0" width="4" height="595" fill="url(#orV)"/><rect x="152" y="0" width="4" height="595" fill="url(#orV)"/>
  <rect x="96" y="250" width="34" height="345" fill="url(#orV)"/>
</g>
<!-- Médaille : logo de l'application -->
<g transform="translate(113 196)" filter="url(#ombre)">
  <path id="festons" fill="url(#or)" d=""/>
  <circle r="47" fill="#0B0E17" stroke="url(#or)" stroke-width="3"/>
  <circle r="41" fill="none" stroke="#E9C46A" stroke-width=".8" stroke-dasharray="2 2.4"/>
  <g transform="translate(0 -6)"><image href="icone.png" x="-26" y="-26" width="52" height="52" clip-path="url(#ic)"/></g>
  <text x="0" y="33" text-anchor="middle" fill="#E9C46A" style="font:700 7px 'DM Sans';letter-spacing:2.2px">★ ★ ★ ★ ★</text>
</g>
<!-- Titre -->
<text x="495" y="112" text-anchor="middle" fill="#12141C" style="font:800 56px 'Syne';letter-spacing:1px">CERTIFICAT</text>
<text x="495" y="140" text-anchor="middle" fill="#2A1E5C" style="font:700 14px 'DM Sans';letter-spacing:6px">DE MÉRITE</text>
<!-- Bandeau doré -->
<g transform="translate(495 172)">
  <path d="M-200 -13 H200 L188 0 L200 13 H-200 L-188 0z" fill="url(#or)"/>
  <path d="M-190 -13 H190 L178 0 L190 13 H-190 L-178 0z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".8"/>
  <text x="0" y="4" text-anchor="middle" fill="#fff" style="font:700 10.5px 'DM Sans';letter-spacing:2.2px">CE CERTIFICAT EST FIÈREMENT DÉCERNÉ À</text>
</g>
<!-- Lignes date / signature -->
<line x1="290" y1="478" x2="430" y2="478" stroke="#B9B2A4" stroke-width=".8"/>
<text x="360" y="496" text-anchor="middle" fill="#12141C" style="font:700 10.5px 'DM Sans';letter-spacing:2px">DATE</text>
<text x="640" y="470" text-anchor="middle" fill="#1B2A6B" style="font:400 40px 'Mr Dafoe'" transform="rotate(-4 640 470)">Oluwatobi</text>
<line x1="560" y1="478" x2="720" y2="478" stroke="#B9B2A4" stroke-width=".8"/>
<text x="640" y="496" text-anchor="middle" fill="#12141C" style="font:700 10.5px 'DM Sans';letter-spacing:2px">PDG OLUWATOBI</text>
<text x="640" y="509" text-anchor="middle" fill="#6B6457" style="font:500 8px 'DM Sans';letter-spacing:1px">Fondateur de TOB-MAQ</text>
<!-- Cachet rouge -->
<g transform="translate(748 446) rotate(-14)" opacity=".86">
  <defs><path id="arc" d="M -37 0 A 37 37 0 1 1 37 0 A 37 37 0 1 1 -37 0"/></defs>
  <circle r="52" fill="none" stroke="#C8102E" stroke-width="3.2"/>
  <circle r="47" fill="none" stroke="#C8102E" stroke-width="1"/>
  <circle r="31" fill="none" stroke="#C8102E" stroke-width="1.6"/>
  <text fill="#C8102E" style="font:700 7.4px 'DM Sans';letter-spacing:1.35px"><textPath href="#arc" startOffset="0">TOB-MAQ · ACADÉMIE NUMÉRIQUE · BÉNIN ·</textPath></text>
  <!-- Logo de l'application en monochrome rouge : coins de cadrage + T -->
  <g fill="none" stroke="#C8102E" stroke-width="3.4" stroke-linecap="square">
    <path d="M-20 -12 V-20 H-12"/><path d="M12 -20 H20 V-12"/><path d="M-20 12 V20 H-12"/><path d="M12 20 H20 V12"/>
  </g>
  <path d="M-12 -12 H12 V-6 H3 V13 H-3 V-6 H-12z" fill="#C8102E"/>
  <rect x="-9" y="15" width="18" height="2.6" fill="#C8102E"/>
  <!-- grain du tampon -->

</g>
<!-- Pied -->
<text x="495" y="545" text-anchor="middle" fill="#9A9284" style="font:500 7.5px 'DM Sans';letter-spacing:1.4px">TOB-MAQ · L'ACADÉMIE DES MÉTIERS CRÉATIFS ET DU NUMÉRIQUE · BÉNIN</text>
</svg>
<script>
// Festons de la médaille et usure du cachet
const n = 28, R1 = 60, R2 = 54; let d = "";
for (let i = 0; i <= n * 2; i++) { const a = i * Math.PI / n, r = i % 2 ? R2 : R1; d += (i ? "L" : "M") + (r * Math.cos(a)).toFixed(2) + " " + (r * Math.sin(a)).toFixed(2); }
document.getElementById("festons").setAttribute("d", d + "Z");
const st = document.querySelector('g[transform^="translate(748"]'); let s = "";
for (let i = 0; i < 260; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 54; s += `<circle cx="${(r * Math.cos(a)).toFixed(1)}" cy="${(r * Math.sin(a)).toFixed(1)}" r="${(Math.random() * 1.3 + .3).toFixed(2)}" fill="#FFF8F0"/>`; }
st.insertAdjacentHTML("beforeend", s);
// Guillochis
const gl = document.querySelector('g[stroke="#EDE6D8"]'); let gs = "";
for (let k = 0; k < 18; k++) { let p = ""; for (let x = 170; x <= 800; x += 6) { const y = 398 + k * 2.2 + 26 * Math.sin((x + k * 14) / 38) * Math.cos((x - k * 9) / 120); p += (x === 170 ? "M" : "L") + x + " " + y.toFixed(1); } gs += `<path d="${p}" opacity="${.35 + (k % 3) * .2}"/>`; }
gl.innerHTML = gs;
</script>
</body></html>
