<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>html,body{margin:0;background:#000}svg{display:block}</style></head><body><div id="out"></div>
<script>
/* Illustrations des formations TOB-MAQ — 800×320, style « bureau de créatif », couleurs de la marque. */
const V = "#5B3DF5", P = "#A83BD8", O = "#F2612D", N = "#0B0E17", N2 = "#151A2B", W = "#F4F1EC";
const F = (w, s) => `font:${w} ${s}px 'DM Sans'`, FM = s => `font:600 ${s}px 'JetBrains Mono'`, FD = s => `font:800 ${s}px 'Syne'`;
let uid = 0;
const g = (x, y, inner, extra = "") => extra.includes("transform=") ? `<g ${extra}>${inner}</g>` : `<g transform="translate(${x} ${y})" ${extra}>${inner}</g>`;
const sh = (cx, cy, rx, ry = 12, o = .45) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#000" opacity="${o}" filter="url(#blur)"/>`;
function bg(a, b, glow = O) {
  return `<defs><linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
  <radialGradient id="glow" cx=".72" cy=".25" r=".6"><stop offset="0" stop-color="${glow}" stop-opacity=".38"/><stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".15" cy=".9" r=".5"><stop offset="0" stop-color="${V}" stop-opacity=".35"/><stop offset="1" stop-color="${V}" stop-opacity="0"/></radialGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
  <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2136"/><stop offset="1" stop-color="#0E1220"/></linearGradient>
  <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9DCE3"/><stop offset="1" stop-color="#8E93A0"/></linearGradient>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${V}"/><stop offset=".55" stop-color="${P}"/><stop offset="1" stop-color="${O}"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter></defs>
  <rect width="800" height="320" fill="url(#bgL)"/><rect width="800" height="320" fill="url(#glow)"/><rect width="800" height="320" fill="url(#glow2)"/>
  ${Array.from({ length: 11 }, (_, i) => `<line x1="${i * 80}" y1="0" x2="${i * 80}" y2="230" stroke="#fff" stroke-opacity=".035"/>`).join("")}
  <path d="M0 236 H800 V320 H0z" fill="#000" opacity=".22"/><rect y="236" width="800" height="84" fill="url(#desk)"/><line x1="0" y1="236" x2="800" y2="236" stroke="#fff" stroke-opacity=".08"/>`;
}
/* Accessoires */
const plant = (x, y, s = 1) => g(x, y, `${sh(0, 4, 26, 6)}<path d="M-18 0 L-14 -36 H14 L18 0z" fill="#E6DCCB"/><path d="M-14 -36 H14 L13 -30 H-13z" fill="#cfc3ad"/>
  ${[[-24, -96, -30], [0, -112, 0], [22, -94, 28], [-12, -78, -55], [14, -76, 52]].map(([dx, dy, r]) => `<path d="M0 -36 Q${dx * .4} ${dy * .55} ${dx} ${dy} Q${dx + 10} ${dy * .7} 2 -36z" fill="#3E8E5A" opacity=".95" transform="rotate(${r * .1})"/>`).join("")}`, `transform="translate(${x} ${y}) scale(${s})"`);
const mug = (x, y, c = O) => g(x, y, `${sh(0, 2, 22, 5)}<path d="M-16 0 V-34 H16 V0 Q16 4 12 4 H-12 Q-16 4 -16 0z" fill="${c}"/><path d="M16 -26 q14 0 14 10 q0 10 -14 10" fill="none" stroke="${c}" stroke-width="5"/><ellipse cx="0" cy="-34" rx="16" ry="4" fill="#3a2418"/><path d="M-6 -44 q4 -8 0 -16 M4 -44 q4 -8 0 -16" stroke="#fff" stroke-opacity=".25" stroke-width="2" fill="none"/>`);
const pencil = (x, y, r = -20, c = "#FFC93C", l = 120) => g(x, y, `<rect x="0" y="-5" width="${l}" height="10" rx="2" fill="${c}"/><rect x="${l - 14}" y="-5" width="10" height="10" fill="#C9CBD3"/><rect x="${l - 4}" y="-5" width="10" height="10" rx="2" fill="#F28CA8"/><path d="M0 -5 L-18 0 L0 5z" fill="#E8C9A0"/><path d="M-12 -1.7 L-18 0 L-12 1.7z" fill="#333"/>`, `transform="translate(${x} ${y}) rotate(${r})"`);
const monitor = (x, y, w, h, scr) => g(x, y, `${sh(w / 2, h + 44, w * .5, 12)}<rect x="${w / 2 - 14}" y="${h}" width="28" height="34" fill="url(#alu)"/><rect x="${w / 2 - 60}" y="${h + 32}" width="120" height="9" rx="4" fill="url(#alu)"/>
  <rect x="-8" y="-8" width="${w + 16}" height="${h + 16}" rx="12" fill="#1A1C22"/><rect width="${w}" height="${h}" rx="4" fill="url(#scr)"/>${scr}<rect width="${w}" height="${h}" rx="4" fill="url(#sheen)"/>`);
const laptop = (x, y, w, scr) => { const h = w * .62; return g(x, y, `${sh(w / 2, h + 18, w * .62, 10)}<rect x="-6" y="-6" width="${w + 12}" height="${h + 12}" rx="10" fill="#1A1C22"/><rect width="${w}" height="${h}" rx="3" fill="url(#scr)"/>${scr}<rect width="${w}" height="${h}" fill="url(#sheen)"/>
  <path d="M-30 ${h + 6} H${w + 30} L${w + 20} ${h + 20} H-20z" fill="url(#alu)"/><rect x="${w / 2 - 26}" y="${h + 6}" width="52" height="4" rx="2" fill="#7c808b"/>`); };
const phone = (x, y, h, scr, r = 0) => { const w = h * .49; return g(x, y, `${sh(w / 2, h + 6, w * .7, 7)}<rect x="-5" y="-5" width="${w + 10}" height="${h + 10}" rx="${w * .17}" fill="#202229"/><rect width="${w}" height="${h}" rx="${w * .13}" fill="#0E1220"/><g clip-path="inset(0 round ${w * .13}px)">${scr}</g><rect x="${w / 2 - w * .17}" y="6" width="${w * .34}" height="${w * .09}" rx="${w * .05}" fill="#000"/>`, `transform="translate(${x} ${y}) rotate(${r})"`); };
const paper = (x, y, w, h, r, inner, c = W) => g(x, y, `<rect width="${w}" height="${h}" rx="3" fill="${c}" filter="url(#soft)"/>${inner}`, `transform="translate(${x} ${y}) rotate(${r})"`);
const lines = (x, y, n, w, gap = 9, c = "#C9C3B8", t = 4) => Array.from({ length: n }, (_, i) => `<rect x="${x}" y="${y + i * gap}" width="${i === n - 1 ? w * .6 : w * (.85 + .15 * ((i * 7) % 3) / 2)}" height="${t}" rx="${t / 2}" fill="${c}"/>`).join("");
const codeLines = (x, y, n, cols = [V, O, "#8FB8FF", "#7FE0B5", "#C9C3B8"]) => Array.from({ length: n }, (_, i) => { const ind = [0, 14, 28, 14, 28, 42, 14, 0][i % 8]; return `<rect x="${x + ind}" y="${y + i * 13}" width="${[34, 60, 26, 80, 44, 30, 56, 22][i % 8]}" height="6" rx="3" fill="${cols[i % cols.length]}"/><rect x="${x + ind + [40, 66, 32, 86, 50, 36, 62, 28][i % 8]}" y="${y + i * 13}" width="${[50, 30, 70, 24, 40, 60, 20, 44][i % 8]}" height="6" rx="3" fill="#ffffff" opacity=".22"/>`; }).join("");
const badge = (x, y, txt, c = O) => g(x, y, `<rect x="0" y="0" width="${txt.length * 9 + 22}" height="26" rx="13" fill="${c}"/><text x="${(txt.length * 9 + 22) / 2}" y="17.5" text-anchor="middle" fill="#fff" style="${F(700, 13)}">${txt}</text>`);
const wheel = (cx, cy, r) => Array.from({ length: 12 }, (_, i) => { const a0 = (i * 30 - 90) * Math.PI / 180, a1 = ((i + 1) * 30 - 90) * Math.PI / 180; return `<path d="M${cx} ${cy} L${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)} A${r} ${r} 0 0 1 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}z" fill="hsl(${i * 30} 80% 58%)"/>`; }).join("") + `<circle cx="${cx}" cy="${cy}" r="${r * .38}" fill="#F4F1EC"/>`;
const wave = (x, y, w, h, c = "#7FE0B5", n = 70) => Array.from({ length: n }, (_, i) => { const a = Math.abs(Math.sin(i * .7) * Math.cos(i * .23)) * h; return `<rect x="${x + i * w / n}" y="${y - a / 2}" width="${w / n * .55}" height="${Math.max(2, a)}" rx="1" fill="${c}"/>`; }).join("");
const candles = (x, y, n, w, h, seed = 1) => { let v = h * .55, s = ""; for (let i = 0; i < n; i++) { const d = Math.sin(i * 1.7 + seed) * h * .14 + (i % 5 === 3 ? -h * .12 : h * .03); const o = v, c = Math.max(10, Math.min(h - 10, v - d)); const up = c < o; s += `<line x1="${x + i * w / n + 5}" y1="${y + Math.min(o, c) - 9}" x2="${x + i * w / n + 5}" y2="${y + Math.max(o, c) + 9}" stroke="${up ? "#4ADE95" : "#FF6B6B"}" stroke-width="1.5"/><rect x="${x + i * w / n}" y="${y + Math.min(o, c)}" width="10" height="${Math.max(3, Math.abs(o - c))}" fill="${up ? "#4ADE95" : "#FF6B6B"}" rx="1"/>`; v = c; } return s; };
const doc = (x, y, w, h, r, head = V) => paper(x, y, w, h, r, `<rect x="12" y="14" width="${w * .5}" height="8" rx="4" fill="${head}"/>${lines(12, 32, Math.floor((h - 44) / 10), w - 24, 10)}`);

/* Scènes des formations */
const S = {
  "fondamentaux-graphisme": () => bg("#1A1440", "#3A1530") + paper(380, 40, 150, 200, -4, `<rect x="12" y="12" width="126" height="120" fill="${V}"/><circle cx="96" cy="58" r="34" fill="${O}"/><text x="14" y="160" fill="${N}" style="${FD(28)}">Aa</text>${lines(14, 172, 2, 110, 9)}`) + g(140, 70, `${sh(70, 160, 70, 10)}${wheel(70, 70, 70)}`) + paper(560, 120, 120, 90, 6, `${[V, P, O, N, "#FFC93C"].map((c, i) => `<rect x="${10 + i * 21}" y="12" width="18" height="44" rx="3" fill="${c}"/>`).join("")}${lines(10, 66, 2, 100, 9)}`) + pencil(560, 262, -12) + plant(720, 250),
  "photoshop-retouche": () => bg("#0D1A33", "#24154A", P) + monitor(150, 30, 420, 196, `<rect x="10" y="10" width="44" height="176" fill="#141927"/>${[0, 1, 2, 3, 4, 5].map(i => `<rect x="20" y="${22 + i * 24}" width="24" height="16" rx="3" fill="${i === 2 ? V : "#2A3148"}"/>`).join("")}<rect x="64" y="10" width="250" height="176" fill="#2A2F45"/><circle cx="189" cy="80" r="34" fill="#C98E6B"/><path d="M129 186 q0 -66 60 -66 q60 0 60 66z" fill="${V}"/><path d="M149 70 q40 -60 80 0 q-10 -30 -40 -30 q-30 0 -40 30z" fill="#2B1A12"/><ellipse cx="189" cy="100" rx="70" ry="94" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5"/><rect x="324" y="10" width="86" height="176" fill="#141927"/>${["Calque 3", "Masque", "Peau", "Fond"].map((t, i) => `<rect x="330" y="${20 + i * 30}" width="74" height="24" rx="3" fill="${i === 1 ? "#2D2560" : "#1F2538"}"/><rect x="335" y="${25 + i * 30}" width="14" height="14" fill="${[O, "#fff", "#C98E6B", "#555"][i]}"/><text x="354" y="${36 + i * 30}" fill="#cfd3e0" style="${F(500, 10)}">${t}</text>`).join("")}`) + g(640, 200, `${sh(40, 40, 50, 8)}<rect x="0" y="0" width="90" height="40" rx="8" fill="#22252D" transform="skewX(-14)"/><path d="M60 -46 l8 50 l-14 -2z" fill="#888"/>`) + mug(84, 266, P),
  "affiches-flyers": () => bg("#2A1238", "#14182E", O) + `<rect x="60" y="20" width="680" height="214" fill="#2B2236" opacity=".5"/>` + paper(110, 34, 140, 196, -3, `<rect width="140" height="196" fill="${N}"/><circle cx="70" cy="80" r="44" fill="${O}"/><text x="12" y="160" fill="#fff" style="${FD(24)}">AFRO</text><text x="12" y="182" fill="${O}" style="${FD(14)}">LIVE · 20H</text>`) + paper(280, 24, 170, 220, 2, `<rect width="170" height="220" fill="${V}"/><circle cx="120" cy="70" r="50" fill="${O}"/><rect x="0" y="120" width="170" height="100" fill="${P}"/><text x="12" y="170" fill="#fff" style="${FD(21)}">LUMIÈRES</text><text x="14" y="198" fill="#FFD23F" style="${FM(12)}">12·04·COTONOU</text>`) + paper(480, 40, 130, 180, 4, `<rect width="130" height="180" fill="#FFD23F"/><text x="12" y="44" fill="${N}" style="${FD(26)}">-30%</text><rect x="12" y="60" width="106" height="70" fill="${O}"/>${lines(12, 142, 3, 100, 10, "#3a2c08")}`) + paper(636, 70, 110, 150, -5, `<rect width="110" height="150" fill="#E8F1FF"/><circle cx="55" cy="56" r="30" fill="#2A6FDB"/>${lines(12, 100, 4, 86, 10, "#9DB5D9")}`) + `${[[160, 34], [360, 24], [545, 40], [690, 70]].map(([x, y]) => `<rect x="${x - 12}" y="${y - 6}" width="24" height="10" fill="#F5E9C8" opacity=".85" transform="rotate(-8 ${x} ${y})"/>`).join("")}`,
  "logo-identite": () => bg("#14182E", "#2A1238", V) + paper(150, 40, 300, 190, -2, `<rect width="300" height="190" fill="#F7F4EE"/>${Array.from({ length: 13 }, (_, i) => `<line x1="${i * 25}" y1="0" x2="${i * 25}" y2="190" stroke="#d9d3c6"/>`).join("")}${Array.from({ length: 8 }, (_, i) => `<line x1="0" y1="${i * 25}" x2="300" y2="${i * 25}" stroke="#d9d3c6"/>`).join("")}<circle cx="150" cy="95" r="62" fill="none" stroke="${O}" stroke-dasharray="4 4"/><circle cx="150" cy="95" r="38" fill="none" stroke="${O}" stroke-dasharray="4 4"/><path d="M150 33 a62 62 0 0 1 54 31 l-33 19 a24 24 0 1 0 0 24 l33 19 a62 62 0 1 1 -54 -93z" fill="${V}"/>`) + pencil(420, 250, -30, "#2B2D33") + g(520, 150, `${sh(80, 80, 100, 8)}<rect width="150" height="88" rx="6" fill="${N}" filter="url(#soft)" transform="rotate(-8)"/><g transform="rotate(-8)"><circle cx="34" cy="44" r="16" fill="${V}"/><text x="58" y="50" fill="#fff" style="${FD(14)}">LAGUNE</text></g><rect x="30" y="40" width="150" height="88" rx="6" fill="#F7F4EE" filter="url(#soft)" transform="rotate(6)"/><g transform="rotate(6)"><text x="48" y="84" fill="${N}" style="${FD(14)}">LAGUNE</text>${lines(48, 96, 2, 80, 8)}</g>`),
  "canva-reseaux": () => bg("#2A1238", "#3A1A20", O) + phone(330, 14, 250, `<rect width="122" height="250" fill="#fff"/><circle cx="20" cy="40" r="10" fill="${O}"/><rect x="36" y="34" width="50" height="6" rx="3" fill="#333"/>${Array.from({ length: 9 }, (_, i) => `<rect x="${4 + (i % 3) * 39}" y="${60 + Math.floor(i / 3) * 39}" width="37" height="37" fill="${[V, O, "#FFD23F", P, "#2A6FDB", O, "#FFD23F", V, P][i]}"/>`).join("")}`) + g(150, 70, `<rect width="140" height="140" rx="10" fill="${O}" filter="url(#soft)" transform="rotate(-8)"/><g transform="rotate(-8)"><text x="16" y="70" fill="#fff" style="${FD(36)}">J-7</text><text x="16" y="96" fill="#fff" style="${F(700, 14)}">RENTRÉE</text></g>`) + g(510, 90, `<rect width="150" height="150" rx="10" fill="${V}" filter="url(#soft)" transform="rotate(7)"/><g transform="rotate(7)"><circle cx="75" cy="66" r="34" fill="#FFD23F"/><text x="16" y="132" fill="#fff" style="${F(700, 14)}">-20 % cahiers</text></g>`) + `${[[300, 60, "♥ 248"], [560, 50, "💬 31"], [470, 250, "↗ 12,4 k"]].map(([x, y, t]) => g(x, y, `<rect width="${t.length * 10 + 24}" height="32" rx="16" fill="#fff" filter="url(#soft)"/><text x="12" y="21" fill="${N}" style="${F(700, 14)};font-family:'DM Sans','Noto Color Emoji'">${t}</text>`)).join("")}`,
  "gimp-inkscape": () => bg("#0E1D24", "#1D1540", "#3BA55D") + laptop(210, 40, 330, `<rect x="0" y="0" width="330" height="20" fill="#141927"/><rect x="0" y="20" width="36" height="185" fill="#141927"/>${[0, 1, 2, 3, 4].map(i => `<rect x="9" y="${30 + i * 26}" width="18" height="18" rx="3" fill="${i === 1 ? O : "#2A3148"}"/>`).join("")}<path d="M70 170 C 110 40, 200 40, 230 120 S 300 170, 310 70" fill="none" stroke="${O}" stroke-width="3"/>${[[70, 170], [230, 120], [310, 70]].map(([x, y]) => `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" fill="#fff" stroke="${V}" stroke-width="2"/>`).join("")}<line x1="230" y1="120" x2="190" y2="70" stroke="#8FB8FF"/><line x1="230" y1="120" x2="270" y2="170" stroke="#8FB8FF"/><circle cx="190" cy="70" r="4" fill="#8FB8FF"/><circle cx="270" cy="170" r="4" fill="#8FB8FF"/>`) + g(620, 110, `<path d="M0 0 l26 70 l-12 4 l-4 30 l-8 -30 l-12 -4z" fill="#E8E8EE" filter="url(#soft)"/><circle cx="2" cy="44" r="4" fill="${N}"/>`) + plant(110, 250, .9),
  "indesign-mise-en-page": () => bg("#1A1035", "#2F0F2A", "#D6006F") + g(140, 50, `${sh(260, 190, 270, 12)}<path d="M0 10 L255 0 V190 L0 196z" fill="#F7F4EE" filter="url(#soft)"/><path d="M265 0 L520 10 V196 L265 190z" fill="#FFFFFF" filter="url(#soft)"/><path d="M0 10 L255 0 V120 L0 126z" fill="#D6006F"/><text x="16" y="80" fill="#fff" style="${FD(30)}">L'ART</text><text x="16" y="110" fill="#fff" style="${FD(30)}">DU PAGNE</text>${[0, 1, 2].map(c => lines(282 + c * 78, 26, 14, 64, 11)).join("")}<rect x="282" y="26" width="140" height="60" fill="${V}" opacity=".85"/>${lines(16, 140, 5, 220, 10)}`) + pencil(560, 268, -8, V),
  "brochures-catalogues": () => bg("#14182E", "#2C1A10", O) + g(160, 40, `${sh(150, 205, 170, 10)}<path d="M0 20 L100 0 V200 L0 210z" fill="${V}"/><path d="M100 0 L200 20 V210 L100 200z" fill="#F7F4EE"/><path d="M200 20 L300 0 V200 L200 210z" fill="#EDE7DB"/><circle cx="50" cy="80" r="26" fill="${O}"/><text x="10" y="160" fill="#fff" style="${FD(13)}">VOYAGE+</text>${lines(116, 40, 12, 70, 12)}${lines(214, 30, 6, 70, 12)}<rect x="214" y="110" width="72" height="56" fill="${O}" opacity=".85"/>`) + g(500, 70, `${sh(90, 170, 110, 8)}<rect width="180" height="170" rx="4" fill="#fff" filter="url(#soft)" transform="rotate(6)"/><g transform="rotate(6)"><text x="14" y="34" fill="${N}" style="${FD(14)}">CATALOGUE</text>${[0, 1, 2, 3].map(i => `<rect x="${14 + (i % 2) * 80}" y="${46 + Math.floor(i / 2) * 58}" width="70" height="44" fill="${[O, V, P, "#FFD23F"][i]}"/>`).join("")}</g>`),
